<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raizin Vault - Frequency Interface Prototype</title>
    <link href="styles/output.css" rel="stylesheet">
    <style>
        .feedback-button {
            transition: transform 0.1s ease-in-out;
        }
        .feedback-button:hover {
            transform: scale(1.1);
        }
        .feedback-button:active {
            transform: scale(0.95);
        }
        .feedback-button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
    <script>
        const MCP_NODE_URL = '/functions/v1/mcp_node';
        const LOG_FEEDBACK_URL = '/functions/v1/log_user_feedback';
        let currentInteractionId = null;

        async function handleFeedback(score) {
            if (!currentInteractionId) {
                console.error("No interaction_id available to send feedback.");
                return;
            }

            const feedbackButtons = document.querySelectorAll('.feedback-button');
            feedbackButtons.forEach(btn => btn.classList.add('disabled'));

            const feedbackStatus = document.getElementById('feedbackStatus');
            feedbackStatus.textContent = "Sending feedback...";

            try {
                const response = await fetch(LOG_FEEDBACK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        interaction_id: currentInteractionId,
                        feedback_score: score
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Feedback submission failed: ${response.status}`);
                }
                const result = await response.json();
                console.log("Feedback response:", result);
                feedbackStatus.textContent = "Feedback sent! Thank you.";
                // Keep buttons disabled to prevent re-submission for this interaction
            } catch (error) {
                console.error("Error sending feedback:", error);
                feedbackStatus.textContent = `Error: ${error.message}`;
                feedbackButtons.forEach(btn => btn.classList.remove('disabled')); // Re-enable on error
            }
        }

        async function handleSubmitQuery() {
            const queryInput = document.getElementById('queryInput');
            const responseDisplay = document.getElementById('responseDisplay');
            const toneIndicator = document.getElementById('toneIndicator');
            const agentIdDisplay = document.getElementById('agentIdDisplay');
            const submitButton = document.getElementById('submitQueryButton');
            const feedbackContainer = document.getElementById('feedbackContainer');
            const feedbackStatus = document.getElementById('feedbackStatus');

            currentInteractionId = null; // Reset for new query
            feedbackContainer.classList.add('hidden');
            document.querySelectorAll('.feedback-button').forEach(btn => btn.classList.remove('disabled')); // Use querySelectorAll here
            feedbackStatus.textContent = "";


            const inputText = queryInput.value;
            responseDisplay.textContent = "Processing...";
            agentIdDisplay.textContent = "";
            submitButton.disabled = true;
            toneIndicator.className = 'w-full h-4 bg-yellow-400 my-2 animate-pulse rounded-md';

            try {
                const response = await fetch(MCP_NODE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ inputText: inputText, source: "prototype_ui_live_feedback" })
                });

                if (!response.ok) {
                    const errorData = await response.text(); // Use .text() for non-JSON errors too
                    throw new Error(`MCP Node request failed: ${response.status} ${errorData}`);
                }

                const mcpResponse = await response.json();
                console.log("Live MCP Response:", mcpResponse);

                responseDisplay.textContent = "";
                submitButton.disabled = false;
                toneIndicator.classList.remove('animate-pulse');

                if (mcpResponse.interaction_id) {
                    currentInteractionId = mcpResponse.interaction_id;
                }

                switch (mcpResponse.status) {
                    case "dissonance_detected":
                        responseDisplay.textContent = `MCP: ${mcpResponse.resolution} (Reason: ${mcpResponse.reason})`;
                        toneIndicator.className = 'w-full h-4 bg-red-500 my-2 rounded-md';
                        break;
                    case "no_route_found":
                    case "routed_not_callable":
                    case "routing_error":
                        responseDisplay.textContent = `MCP: ${mcpResponse.status} (Reason: ${mcpResponse.reason || 'N/A'})`;
                        agentIdDisplay.textContent = mcpResponse.agent_id ? `Targeted: ${mcpResponse.agent_id}` : "";
                        toneIndicator.className = 'w-full h-4 bg-gray-400 my-2 rounded-md';
                        break;
                    case "routed_and_executed":
                        if (mcpResponse.agent_response && mcpResponse.agent_id) {
                            agentIdDisplay.textContent = `Agent: ${mcpResponse.agent_id}`;
                            responseDisplay.textContent = `[${mcpResponse.agent_response.agent_id}]: ${mcpResponse.agent_response.response_text} (Conf: ${mcpResponse.agent_response.confidence_score})`;
                            if (currentInteractionId) feedbackContainer.classList.remove('hidden'); // Show feedback buttons
                            toneIndicator.className = mcpResponse.agent_id === "clarity_pulse_v1_001" ?
                                'w-full h-4 bg-blue-500 my-2 rounded-md' : 'w-full h-4 bg-green-500 my-2 rounded-md';
                        } else {
                            responseDisplay.textContent = `MCP: Routed to ${mcpResponse.agent_id}, but unexpected agent response.`;
                            toneIndicator.className = 'w-full h-4 bg-yellow-500 my-2 rounded-md';
                        }
                        break;
                    case "error":
                         responseDisplay.textContent = `MCP Error: ${mcpResponse.message}`;
                         toneIndicator.className = 'w-full h-4 bg-red-700 my-2 rounded-md';
                        break;
                    default:
                        responseDisplay.textContent = "Unknown MCP status: " + mcpResponse.status;
                        toneIndicator.className = 'w-full h-4 bg-gray-200 my-2 rounded-md';
                }
            } catch (error) {
                console.error("Error in handleSubmitQuery:", error);
                responseDisplay.textContent = `Error: ${error.message}`;
                toneIndicator.className = 'w-full h-4 bg-red-700 my-2 rounded-md';
                submitButton.disabled = false;
                toneIndicator.classList.remove('animate-pulse');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('submitQueryButton')?.addEventListener('click', handleSubmitQuery);

            const thumbUpButton = document.getElementById('thumbUpButton');
            const thumbDownButton = document.getElementById('thumbDownButton');
            // No need for global feedbackButtons array, can select them inside handleFeedback or keep as is.

            thumbUpButton?.addEventListener('click', () => handleFeedback(1));
            thumbDownButton?.addEventListener('click', () => handleFeedback(-1));
        });
    </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-4">
    <div class="w-full max-w-2xl bg-gray-800 p-6 rounded-lg shadow-xl">
        <header class="text-center mb-6">
            <h1 class="text-4xl font-bold text-purple-400">Raizin Vault</h1>
            <p class="text-lg text-purple-300">Frequency Interface Prototype (Live Feedback)</p>
        </header>

        <div class="mb-4">
            <label for="queryInput" class="block text-sm font-medium text-gray-300 mb-1">Enter your query:</label>
            <input type="text" id="queryInput" class="bg-gray-700 text-white w-full p-2 border border-gray-600 rounded-md focus:ring-purple-500 focus:border-purple-500" placeholder="e.g., what is raizin vault?">
        </div>

        <button id="submitQueryButton" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-md transition duration-150">
            Transmit Query
        </button>

        <div class="mt-6">
            <h2 class="text-xl font-semibold text-purple-300">System Response:</h2>
            <div id="toneIndicator" class="w-full h-4 bg-gray-700 my-2 rounded-md"></div>
            <p id="agentIdDisplay" class="text-sm text-gray-400 italic mb-1"></p>
            <div id="responseDisplay" class="mt-1 p-3 bg-gray-700 rounded-md min-h-[50px] text-gray-200 whitespace-pre-wrap">
                Awaiting query...
            </div>
            <div id="feedbackContainer" class="mt-3 text-center hidden">
                <span class="text-sm text-gray-400 mr-2">Rate this response:</span>
                <button id="thumbUpButton" class="feedback-button text-2xl p-1" aria-label="Thumbs Up">👍</button>
                <button id="thumbDownButton" class="feedback-button text-2xl p-1 ml-2" aria-label="Thumbs Down">👎</button>
                <p id="feedbackStatus" class="text-xs text-purple-300 mt-1 h-4"></p>
            </div>
        </div>
    </div>
</body>
</html>
