<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raizin Vault - Frequency Interface Prototype</title>
    <link href="styles/output.css" rel="stylesheet">
    <script>
        // URL for the deployed MCP Node function
        // For local Supabase CLI: 'http://localhost:54321/functions/v1/mcp_node'
        // For deployed: '[YOUR_SUPABASE_PROJECT_URL]/functions/v1/mcp_node'
        // Using a relative path assuming deployed to the same Supabase project.
        const MCP_NODE_URL = '/functions/v1/mcp_node';
        // This might need to be configured if your project URL is different
        // or if you are running locally and your page isn't served by Supabase.
        // For development, you might replace this with the full localhost URL.

        async function handleSubmitQuery() {
            const queryInput = document.getElementById('queryInput');
            const responseDisplay = document.getElementById('responseDisplay');
            const toneIndicator = document.getElementById('toneIndicator');
            const agentIdDisplay = document.getElementById('agentIdDisplay');
            const submitButton = document.getElementById('submitQueryButton');

            const inputText = queryInput.value;
            responseDisplay.textContent = "Processing...";
            agentIdDisplay.textContent = "";
            submitButton.disabled = true;
            toneIndicator.className = 'w-full h-4 bg-yellow-400 my-2 animate-pulse rounded-md'; // Processing indicator

            try {
                const response = await fetch(MCP_NODE_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // 'Authorization': 'Bearer YOUR_SUPABASE_ANON_KEY' // Add if RLS requires auth for function access
                    },
                    body: JSON.stringify({
                        inputText: inputText,
                        source: "prototype_ui_live", // Added source
                        // desiredFrequency: { clarity: 0.9 } // Example if sending desiredFrequency
                    })
                });

                if (!response.ok) {
                    const errorData = await response.text();
                    throw new Error(`MCP Node request failed with status ${response.status}: ${errorData}`);
                }

                const mcpResponse = await response.json();
                console.log("Live MCP Response:", mcpResponse);

                // Clear processing
                responseDisplay.textContent = "";
                submitButton.disabled = false;
                toneIndicator.classList.remove('animate-pulse');

                switch (mcpResponse.status) {
                    case "dissonance_detected":
                        responseDisplay.textContent = `MCP: ${mcpResponse.resolution} (Reason: ${mcpResponse.reason})`;
                        toneIndicator.className = 'w-full h-4 bg-red-500 my-2 rounded-md';
                        break;
                    case "no_route_found":
                    case "routed_not_callable": // MCP identified agent but couldn't call (e.g. URL missing)
                    case "routing_error": // MCP tried to call agent but failed
                        responseDisplay.textContent = `MCP: ${mcpResponse.status} (Reason: ${mcpResponse.reason || 'No specific reason provided.'})`;
                        agentIdDisplay.textContent = mcpResponse.agent_id ? `Targeted Agent: ${mcpResponse.agent_id}` : "";
                        toneIndicator.className = 'w-full h-4 bg-gray-400 my-2 rounded-md';
                        break;
                    case "routed_and_executed":
                        if (mcpResponse.agent_response && mcpResponse.agent_id) {
                            agentIdDisplay.textContent = `MCP routed to Agent: ${mcpResponse.agent_id}`;
                            responseDisplay.textContent = `Agent [${mcpResponse.agent_response.agent_id}]: ${mcpResponse.agent_response.response_text} (Confidence: ${mcpResponse.agent_response.confidence_score})`;
                            // Assuming 'clarity' for blue tone for now if clarity_pulse_v1_001 responded
                            if (mcpResponse.agent_id === "clarity_pulse_v1_001") {
                                toneIndicator.className = 'w-full h-4 bg-blue-500 my-2 rounded-md';
                            } else {
                                toneIndicator.className = 'w-full h-4 bg-green-500 my-2 rounded-md'; // Generic green for other agents
                            }
                        } else {
                            responseDisplay.textContent = `MCP: Routed to ${mcpResponse.agent_id}, but agent response format is unexpected.`;
                            toneIndicator.className = 'w-full h-4 bg-yellow-500 my-2 rounded-md';
                        }
                        break;
                    case "error":
                         responseDisplay.textContent = `MCP Error: ${mcpResponse.message}`;
                         toneIndicator.className = 'w-full h-4 bg-red-700 my-2 rounded-md';
                        break;
                    default:
                        responseDisplay.textContent = "Unknown MCP response status: " + mcpResponse.status;
                        toneIndicator.className = 'w-full h-4 bg-gray-200 my-2 rounded-md';
                }

            } catch (error) {
                console.error("Error in handleSubmitQuery:", error);
                responseDisplay.textContent = `Error: ${error.message}`;
                toneIndicator.className = 'w-full h-4 bg-red-700 my-2 rounded-md'; // Dark red for client-side script error
                submitButton.disabled = false;
                toneIndicator.classList.remove('animate-pulse');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const submitButton = document.getElementById('submitQueryButton');
            if(submitButton) {
                submitButton.addEventListener('click', handleSubmitQuery);
            }
            // Set a default MCP_NODE_URL for local testing if not served by Supabase
            // This is a common pattern if you're running a local dev server for the HTML page
            // and Supabase functions are on localhost:54321
            if (window.location.hostname === "localhost" && !MCP_NODE_URL.startsWith("http")) {
                 // Overwrite if it seems like we are in local dev and MCP_NODE_URL is relative
                 // You might want a more robust configuration mechanism for real apps
                 // For example, injecting this URL via a script or using environment variables at build time
                 // For now, this hardcoded overwrite helps for local `npx http-server public` style testing
                 // globalThis.MCP_NODE_URL_OVERWRITTEN_FOR_LOCAL = 'http://localhost:54321/functions/v1/mcp_node';
                 // console.warn(`MCP_NODE_URL might need to be '${globalThis.MCP_NODE_URL_OVERWRITTEN_FOR_LOCAL}' for local testing if not served via Supabase.`);
                 // For simplicity, I will not overwrite here, but it's a common gotcha.
                 // The user will need to ensure their Supabase CLI is running and functions are served,
                 // and the page is either also served by Supabase or they adjust MCP_NODE_URL.
            }
        });
    </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-2xl bg-gray-800 p-6 rounded-lg shadow-xl">
        <header class="text-center mb-6">
            <h1 class="text-4xl font-bold text-purple-400">Raizin Vault</h1>
            <p class="text-lg text-purple-300">Frequency Interface Prototype (Live)</p>
        </header>

        <div class="mb-4">
            <label for="queryInput" class="block text-sm font-medium text-gray-300 mb-1">Enter your query:</label>
            <input type="text" id="queryInput" class="bg-gray-700 text-white w-full p-2 border border-gray-600 rounded-md focus:ring-purple-500 focus:border-purple-500" placeholder="e.g., what is raizin vault?">
        </div>

        <button id="submitQueryButton" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-md transition duration-150">
            Transmit Query
        </button>

        <div class="mt-6">
            <h2 class="text-xl font-semibold text-purple-300">System Response:</h2>
            <div id="toneIndicator" class="w-full h-4 bg-gray-700 my-2 rounded-md"></div>
            <p id="agentIdDisplay" class="text-sm text-gray-400 italic mb-1"></p>
            <div id="responseDisplay" class="mt-1 p-3 bg-gray-700 rounded-md min-h-[50px] text-gray-200 whitespace-pre-wrap">
                Awaiting query...
            </div>
        </div>
    </div>

</body>
</html>
